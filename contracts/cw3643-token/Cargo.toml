[package]
name = "cw3643_token"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "CW-3643 compliant security token implementation for CosmWasm (based on ERC-3643 standard)"
repository.workspace = true
license.workspace = true
keywords = ["cosmwasm", "cw3643", "security-token", "rwa", "compliance"]
categories = ["cryptography::cryptocurrencies"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []
cosmwasm_2_0 = []

[package.metadata.scripts]
optimize = """docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/optimizer:0.17.0
"""

[dependencies]
cosmwasm-schema.workspace = true
cosmwasm-std = { workspace = true, features = ["cosmwasm_1_4"] }
cw-storage-plus.workspace = true
cw2.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true
base64ct.workspace = true
serde_json.workspace = true

[dev-dependencies]
cw-multi-test.workspace = true
bech32.workspace = true
identity_registry_cw.workspace = true
trusted_issuers_registry_cw.workspace = true
claim_topics_registry_cw.workspace = true
onchainid_cw.workspace = true
compliance_contract_cw.workspace = true


